<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quantum.fun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--c:#00f0ff;--m:#ff2a6d;--y:#fcee0a;--g:#39ff88;--ink:#e8f4ff;--mut:#8a9bb5;--bd:rgba(0,240,255,.25);--cut:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);--cs:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#000}
*{box-sizing:border-box;margin:0}
body{font:400 16px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:#000;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(rgba(0,240,255,.07) 1px,transparent 1px) 0 0/56px 56px,linear-gradient(90deg,rgba(0,240,255,.07) 1px,transparent 1px) 0 0/56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 25%,#000 15%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 25%,#000 15%,transparent 75%)}
body::after{content:'';position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(rgba(0,0,0,0) 50%,rgba(0,240,255,.04) 50%) 0 0/100% 4px,radial-gradient(ellipse at 12% 0,rgba(255,42,109,.18),transparent 45%),radial-gradient(ellipse at 92% 8%,rgba(0,240,255,.15),transparent 45%),radial-gradient(ellipse at 50% 120%,rgba(157,77,255,.14),transparent 50%),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%)}
button{font-family:inherit;color:inherit}
.wrap{width:min(1000px,100% - 32px);margin:auto;position:relative;z-index:2}
.hero{text-align:center;padding:46px 0 26px}
.atom{font-size:54px;display:inline-block;animation:sp 14s linear infinite;filter:drop-shadow(0 0 16px #00f0ff)}
@keyframes sp{to{transform:rotate(360deg)}}
h1{font:900 clamp(34px,10.5vw,76px)/1.05 Orbitron,sans-serif;letter-spacing:-1px;background:linear-gradient(135deg,#00f0ff,#ff2a6d);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin:8px 0 12px;filter:drop-shadow(0 0 14px rgba(0,240,255,.45));animation:gl 5s infinite}
@keyframes gl{0%,90%,100%{transform:none;filter:drop-shadow(0 0 14px rgba(0,240,255,.45))}91%{transform:translate(-3px,1px) skewX(-6deg);filter:drop-shadow(3px 0 0 rgba(255,42,109,.9)) drop-shadow(-3px 0 0 rgba(0,240,255,.9))}93%{transform:translate(3px,-1px) skewX(4deg);filter:drop-shadow(-3px 0 0 rgba(255,42,109,.9)) drop-shadow(3px 0 0 rgba(0,240,255,.9))}95%{transform:translate(-1px,0)}}
.sub{font:400 13px/1.7 'JetBrains Mono',monospace;color:var(--mut);letter-spacing:1px;max-width:460px;margin:0 auto 24px;text-transform:uppercase}
.btn{font:700 13px 'JetBrains Mono',monospace;letter-spacing:2px;text-transform:uppercase;padding:15px 28px;border:0;background:linear-gradient(135deg,#00f0ff,#0090ff);color:#000;clip-path:var(--cut);cursor:pointer;touch-action:manipulation;transition:.2s}
.btn:hover,.btn:active{background:linear-gradient(135deg,#6af6ff,#00c8ff)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;padding:18px 0 40px}
.card{border:1px solid var(--a);padding:22px 14px 18px;text-align:center;cursor:pointer;background:rgba(6,9,16,.84);clip-path:var(--cut);box-shadow:inset 0 0 30px rgba(0,240,255,.06);transition:.2s;touch-action:manipulation;display:grid;gap:5px;justify-items:center;align-content:start}
.card:hover,.card:active{box-shadow:inset 0 0 40px rgba(0,240,255,.2);background:rgba(10,16,28,.9)}
.ic{font-size:44px;line-height:1.1;filter:drop-shadow(0 0 10px var(--a))}
.card b{font:700 14px Orbitron,sans-serif;letter-spacing:1px;color:var(--a);text-shadow:0 0 10px var(--a)}
.card small{font:400 12px/1.4 'JetBrains Mono',monospace;color:var(--mut)}
.card em{font:600 10px 'JetBrains Mono',monospace;font-style:normal;letter-spacing:1px;color:var(--a);border:1px solid var(--a);padding:2px 9px;margin-top:6px;text-transform:uppercase}
footer{text-align:center;font:400 11px 'JetBrains Mono',monospace;letter-spacing:1px;color:var(--mut);padding:10px 0 34px;text-transform:uppercase}
#st{position:fixed;inset:0;z-index:50;background:#000 linear-gradient(rgba(0,240,255,.06) 1px,transparent 1px) 0 0/56px 56px;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#st.on{display:flex}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--c);background:rgba(0,0,0,.88);box-shadow:0 6px 24px rgba(0,240,255,.12)}
#gt{flex:1;font:700 14px Orbitron,sans-serif;letter-spacing:2px;text-shadow:0 0 10px rgba(0,240,255,.6)}#gs{font:600 12px 'JetBrains Mono',monospace;color:var(--c);text-align:right}
.ib{border:1px solid var(--c);background:rgba(0,240,255,.08);width:40px;height:40px;font-size:18px;color:var(--c);cursor:pointer;clip-path:var(--cs)}
#ga{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;position:relative;overflow:hidden}
.big{font:700 20px Orbitron,sans-serif;letter-spacing:1px;padding:28px 20px;border:1px solid var(--c);background:rgba(0,240,255,.1);color:var(--c);text-shadow:0 0 12px var(--c);clip-path:var(--cut);cursor:pointer;width:min(340px,92%);touch-action:manipulation;transition:.15s}
.big:active{background:var(--c);color:#000;text-shadow:none}
.big.wait{border-color:var(--m);color:var(--m);background:rgba(255,42,109,.12);text-shadow:0 0 12px var(--m)}.big.go{border-color:var(--g);color:var(--g);background:rgba(57,255,136,.16);text-shadow:0 0 12px var(--g)}
.big.sm{padding:16px 20px;font-size:16px}
.gr{display:grid;grid-template-columns:repeat(var(--c),1fr);gap:10px;width:min(360px,92%)}
.tile{aspect-ratio:1;font-size:32px;border:1px solid var(--bd);background:#05080f;cursor:pointer;clip-path:var(--cs);touch-action:manipulation;transition:.15s}
.tile.up{background:rgba(0,240,255,.22);border-color:var(--c);box-shadow:inset 0 0 18px rgba(0,240,255,.3)}.hole{font-size:36px}.hole.up{background:rgba(255,42,109,.25);border-color:var(--m);box-shadow:inset 0 0 18px rgba(255,42,109,.35)}
.opt{padding:20px 8px;font:700 15px Orbitron,sans-serif;letter-spacing:1px;border:1px solid var(--c);background:rgba(0,240,255,.08);color:#fff;cursor:pointer;clip-path:var(--cs);touch-action:manipulation}.opt:active{background:var(--c);color:#000}
.word{font:900 clamp(34px,11vw,60px)/1.1 Orbitron,sans-serif;text-align:center;text-shadow:0 0 18px rgba(0,240,255,.35)}
.hint{font:400 12px/1.5 'JetBrains Mono',monospace;color:var(--mut);text-align:center;letter-spacing:.5px}
#ti{font:600 22px 'JetBrains Mono',monospace;padding:14px 18px;border:1px solid var(--c);background:#02040a;color:#fff;width:min(340px,92%);text-align:center;clip-path:var(--cs)}#ti:focus{outline:none;box-shadow:inset 0 0 16px rgba(0,240,255,.25)}
canvas{touch-action:none;max-width:100%;border:1px solid var(--c);box-shadow:0 0 24px rgba(0,240,255,.25)}#go{border:0;box-shadow:none;width:100%;height:100%;position:absolute;inset:0}
.dp{display:flex;gap:10px}.dp button{width:66px;height:56px;border:1px solid var(--bd);background:#05080f;font-size:20px;color:var(--c);cursor:pointer;clip-path:var(--cs);touch-action:manipulation}.dp button:active{background:var(--c);color:#000}
#bp{position:absolute;inset:0;overflow:hidden}
#bp i{position:absolute;bottom:-110px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),rgba(0,240,255,.12) 60%);border:1px solid var(--c);box-shadow:0 0 14px rgba(0,240,255,.5),inset 0 0 14px rgba(0,240,255,.25);animation:rise linear forwards;cursor:pointer}
#bp i:nth-child(3n){border-color:var(--m);box-shadow:0 0 14px rgba(255,42,109,.5),inset 0 0 14px rgba(255,42,109,.25)}
@keyframes rise{to{transform:translateY(-130vh)}}
.coin{width:160px;height:160px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#0a1424,#000);border:3px solid var(--c);display:grid;place-items:center;font:900 64px Orbitron,sans-serif;color:var(--c);text-shadow:0 0 16px var(--c);box-shadow:0 0 40px rgba(0,240,255,.6),inset 0 0 30px rgba(0,240,255,.25)}
.coin.flip{animation:fl .45s}@keyframes fl{50%{transform:rotateY(540deg) scale(1.2)}to{transform:rotateY(1080deg)}}
@media(prefers-reduced-motion:reduce){.atom,h1,.coin.flip{animation:none}}

/* FUTURE SYSTEMS VISUAL UPGRADE */
body{background:radial-gradient(ellipse at 50% -12%,#10243b 0%,#050812 36%,#010207 72%,#000 100%)}
body::before{background-size:42px 42px;opacity:.8;animation:grid-drift 28s linear infinite}
@keyframes grid-drift{to{background-position:42px 42px}}
body::after{background:linear-gradient(rgba(0,0,0,0) 50%,rgba(0,240,255,.025) 50%) 0 0/100% 4px,radial-gradient(ellipse at 12% 0,rgba(255,42,109,.2),transparent 45%),radial-gradient(ellipse at 92% 8%,rgba(0,240,255,.2),transparent 45%),radial-gradient(ellipse at 50% 120%,rgba(157,77,255,.2),transparent 50%),radial-gradient(ellipse at center,transparent 48%,rgba(0,0,0,.82) 100%)}
.hero{padding:32px 0 28px;position:relative}
.eyebrow{display:flex;align-items:center;justify-content:center;gap:10px;color:#8ffaff;font:600 10px 'JetBrains Mono',monospace;letter-spacing:2.3px;margin:0 auto 15px;text-shadow:0 0 12px rgba(0,240,255,.55)}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--g);box-shadow:0 0 12px var(--g);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.orbit-mark{width:76px;height:76px;border:1px solid rgba(0,240,255,.32);border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;position:relative;box-shadow:0 0 30px rgba(0,240,255,.08),inset 0 0 24px rgba(0,240,255,.08)}
.orbit-mark:before,.orbit-mark:after{content:"";position:absolute;inset:9px;border:1px solid rgba(255,42,109,.65);border-radius:50%;transform:rotate(55deg) scaleX(.42)}
.orbit-mark:after{border-color:rgba(0,240,255,.75);transform:rotate(-55deg) scaleX(.42)}
.orbit-mark i{position:absolute;width:7px;height:7px;background:var(--c);border-radius:50%;box-shadow:0 0 14px var(--c);animation:orbit 5s linear infinite}
.orbit-mark b{position:absolute;width:5px;height:5px;background:var(--m);border-radius:50%;box-shadow:0 0 12px var(--m);animation:orbit 3.4s linear infinite reverse}
.orbit-mark span{font-size:25px;color:#fff;text-shadow:0 0 18px var(--c);z-index:1}
@keyframes orbit{to{transform:rotate(360deg) translateX(29px) rotate(-360deg)}}
h1{letter-spacing:-2px;text-shadow:0 0 32px rgba(0,240,255,.12)}
.sub{max-width:500px}
.hero-meta{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:0 auto 22px}
.hero-meta span{font:600 9px 'JetBrains Mono',monospace;letter-spacing:1px;color:#b7c9dc;border:1px solid rgba(0,240,255,.19);background:rgba(0,240,255,.035);padding:6px 9px;clip-path:var(--cs)}
.btn{position:relative;overflow:hidden;box-shadow:0 0 22px rgba(0,240,255,.18);border:1px solid rgba(255,255,255,.22);clip-path:none;transform:skewX(-5deg)}
.btn:hover,.btn:active{box-shadow:0 0 32px rgba(0,240,255,.42);transform:skewX(-5deg) translateY(-2px)}
.cards{gap:13px;padding-top:20px}
.card{position:relative;overflow:hidden;clip-path:none;border-radius:3px;background:linear-gradient(145deg,rgba(13,23,39,.93),rgba(3,6,14,.94));border-color:color-mix(in srgb,var(--a) 36%,transparent);box-shadow:inset 0 0 24px color-mix(in srgb,var(--a) 5%,transparent),0 8px 24px rgba(0,0,0,.18);min-height:190px;transition:transform .22s,border-color .22s,box-shadow .22s}
.card:before{content:"";position:absolute;top:0;left:14px;right:14px;height:1px;background:linear-gradient(90deg,transparent,var(--a),transparent);opacity:.8}
.card:after{content:"";position:absolute;right:-28px;top:-28px;width:72px;height:72px;border:1px solid color-mix(in srgb,var(--a) 25%,transparent);transform:rotate(45deg);pointer-events:none}
.card:hover,.card:active{transform:translateY(-4px);border-color:var(--a);box-shadow:inset 0 0 35px color-mix(in srgb,var(--a) 12%,transparent),0 0 24px color-mix(in srgb,var(--a) 12%,transparent)}
.ic{margin:8px 0 5px;font-size:42px}
.card b{font-size:12px;letter-spacing:1.2px}
.card small{max-width:190px;min-height:34px}
.card em{font-size:9px;background:color-mix(in srgb,var(--a) 8%,transparent)}
footer{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-size:9px;letter-spacing:1.4px}
.footer-line{height:1px;width:clamp(18px,8vw,70px);background:linear-gradient(90deg,transparent,var(--c))}
.footer-dot{color:var(--m);text-shadow:0 0 10px var(--m)}
#st{background:radial-gradient(ellipse at 50% 0,rgba(0,240,255,.08),transparent 55%),#02040a}
.bar{border-bottom-color:rgba(0,240,255,.45);backdrop-filter:blur(16px)}
.ib{transition:.2s}.ib:hover,.ib:active{background:var(--c);color:#000;box-shadow:0 0 18px rgba(0,240,255,.35)}
.big{box-shadow:0 0 26px rgba(0,240,255,.08),inset 0 0 28px rgba(0,240,255,.035)}
.tile{box-shadow:inset 0 0 16px rgba(0,240,255,.025);transition:transform .12s,background .12s,border-color .12s}
.tile:active{transform:scale(.94)}
.system-readout{margin:22px auto 0;font:500 9px 'JetBrains Mono',monospace;letter-spacing:2px;color:#627e9b;text-align:center}.system-readout:before{content:'▰ ';color:var(--g);text-shadow:0 0 8px var(--g)}
@media(max-width:420px){.hero{padding-top:24px}.eyebrow{font-size:8px;letter-spacing:1.5px}.orbit-mark{width:64px;height:64px}.hero-meta{gap:5px}.hero-meta span{font-size:8px;padding:5px 7px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:17px 9px 14px;min-height:184px}.card b{font-size:11px}.card small{font-size:11px}}
@media(prefers-reduced-motion:reduce){body::before,.pulse,.orbit-mark i,.orbit-mark b{animation:none}.card,.btn{transition:none}}


/* NEON ARCADE: interactive holograms, particles, transitions and sound */
#particle-field{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
#particle-field i{position:absolute;width:2px;height:2px;border-radius:50%;background:#8ffaff;box-shadow:0 0 9px #00f0ff;opacity:.65;animation:particle-float linear infinite}
@keyframes particle-float{0%{transform:translate3d(0,15vh,0);opacity:0}15%{opacity:.75}85%{opacity:.5}100%{transform:translate3d(var(--drift),-115vh,0);opacity:0}}
.card{transform-style:preserve-3d;will-change:transform;isolation:isolate}
.card .card-scan{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.09) 43%,transparent 60%);transform:translateX(-130%);z-index:0}
.card:hover .card-scan,.card:focus-visible .card-scan{opacity:1;animation:scan-sweep .7s ease-out}
@keyframes scan-sweep{to{transform:translateX(130%)}}
.card:focus-visible{outline:2px solid var(--a);outline-offset:3px}
.card > *{position:relative;z-index:1}
#st{opacity:0;visibility:hidden;transform:scale(1.025);transition:opacity .22s ease,transform .22s ease,visibility .22s}
#st.on{opacity:1;visibility:visible;transform:scale(1)}
#st.transitioning #ga{animation:game-arrive .35s cubic-bezier(.2,.8,.2,1)}
@keyframes game-arrive{0%{opacity:0;transform:translateY(12px) scale(.98);filter:blur(4px)}100%{opacity:1;transform:none;filter:blur(0)}}
.fx-controls{position:fixed;right:14px;bottom:14px;z-index:8;display:flex;gap:8px}
.fx-btn{border:1px solid rgba(0,240,255,.35);background:rgba(3,10,20,.88);color:#9dfaff;font:600 10px 'JetBrains Mono',monospace;letter-spacing:1px;padding:10px 12px;backdrop-filter:blur(12px);box-shadow:0 0 16px rgba(0,240,255,.08);cursor:pointer}
.fx-btn:active{background:rgba(0,240,255,.18)}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translate(-50%,-12px);opacity:0;pointer-events:none;z-index:100;padding:9px 14px;border:1px solid rgba(0,240,255,.4);background:rgba(2,8,18,.94);color:#b8fbff;font:10px 'JetBrains Mono',monospace;letter-spacing:1px;transition:.2s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){#particle-field i{animation:none;display:none}#st,#ga,.card-scan{transition:none;animation:none!important}}


/* BONUS GAME MODULES */
.game-panel{width:min(420px,96%);display:grid;gap:14px;justify-items:center}
.game-stat{font:600 11px 'JetBrains Mono',monospace;letter-spacing:1px;color:var(--c);text-align:center}
.game-actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.game-actions button,.game-btn{border:1px solid var(--c);background:rgba(0,240,255,.08);color:#dffcff;padding:12px 15px;font:600 11px 'JetBrains Mono',monospace;letter-spacing:1px;cursor:pointer;clip-path:var(--cs);touch-action:manipulation}
.game-actions button:active,.game-btn:active{background:var(--c);color:#000}
.puzzle-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;width:min(320px,92vw)}
.puzzle-grid button{aspect-ratio:1;border:1px solid rgba(0,240,255,.35);background:linear-gradient(145deg,#101b2a,#03060d);color:#aafaff;font:700 clamp(17px,5vw,25px) Orbitron,sans-serif;box-shadow:inset 0 0 14px rgba(0,240,255,.04);cursor:pointer}
.puzzle-grid button.blank{background:rgba(0,240,255,.04);border-style:dashed;color:transparent}
.puzzle-grid button:active{border-color:var(--m);box-shadow:0 0 14px rgba(255,42,109,.25)}
.lane-wrap{width:min(340px,90%);height:360px;position:relative;overflow:hidden;border:1px solid var(--c);background:linear-gradient(#040812,#081526);box-shadow:inset 0 0 30px rgba(0,240,255,.1)}
.lane-wrap:before,.lane-wrap:after{content:"";position:absolute;top:0;bottom:0;width:1px;background:rgba(0,240,255,.25);left:33.3%}
.lane-wrap:after{left:66.6%}
.runner{position:absolute;bottom:20px;width:25%;height:34px;display:grid;place-items:center;font-size:25px;filter:drop-shadow(0 0 9px var(--c));transition:left .1s;z-index:2}
.obstacle{position:absolute;width:23%;height:27px;border:1px solid var(--m);background:rgba(255,42,109,.3);box-shadow:0 0 13px rgba(255,42,109,.3);display:grid;place-items:center;color:#fff;font-size:12px}
.dodge-controls{display:flex;gap:14px}
.dodge-controls button{width:76px;height:46px;border:1px solid var(--c);background:#06101c;color:var(--c);font-size:22px;touch-action:manipulation}
.whole-meter{width:min(320px,90%);height:8px;background:#172333;border:1px solid rgba(0,240,255,.25);overflow:hidden}
.whole-meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--m));box-shadow:0 0 12px var(--c)}
.color-pad{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:min(320px,92%)}
.color-pad button{height:100px;border:1px solid rgba(255,255,255,.3);font:700 12px Orbitron,sans-serif;cursor:pointer;touch-action:manipulation}
@media(max-height:560px){.lane-wrap{height:240px}}


/* GAME GUIDE + EXPLICIT START BUTTONS */
.card{cursor:default;clip-path:none;border-radius:10px;position:relative;overflow:hidden;}
.card:before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,var(--a),var(--b),transparent);opacity:.9}
.card small{min-height:34px}
.card .howto{font:400 11px/1.55 'JetBrains Mono',monospace;color:#b7c7d9;text-align:left;width:100%;border-top:1px solid rgba(0,240,255,.14);padding-top:10px;margin-top:7px}
.card .howto strong{color:var(--a);font-weight:600;letter-spacing:1px;display:block;margin-bottom:4px;font-size:10px}
.card-start{width:100%;margin-top:8px;padding:11px 8px;border:1px solid var(--a);background:linear-gradient(110deg,rgba(0,240,255,.15),rgba(255,42,109,.12));color:#eafcff;font:700 11px 'JetBrains Mono',monospace;letter-spacing:1.2px;cursor:pointer;clip-path:var(--cs);touch-action:manipulation;transition:background .18s,transform .18s}
.card-start:hover,.card-start:focus-visible{background:var(--a);color:#02060b;outline:none;box-shadow:0 0 18px var(--a)}
.card-start:active{transform:scale(.97)}
@media(max-width:420px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:18px 10px 13px}.card .ic{font-size:36px}.card b{font-size:12px}.card .howto{font-size:10px}}

/* MOBILE TOUCH COMFORT: keep game controls reachable and easy to tap */
#st{height:100vh;height:100dvh;min-height:0}

      fxOn=true,soundOn=false,audioCtx=null;
  var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(function(){toast.classList.remove('show')},1500)}
  function makeParticles(){
    field.innerHTML='';
    if(!fxOn||reduced)return;
    var count=Math.min(38,Math.max(18,Math.floor(window.innerWidth/13)));
    for(var i=0;i<count;i++){var p=document.createElement('i');p.style.left=(Math.random()*100)+'%';p.style.top=(Math.random()*100)+'%';p.style.setProperty('--drift',((Math.random()-.5)*150)+'px');p.style.animationDuration=(9+Math.random()*18)+'s';p.style.animationDelay=(-Math.random()*22)+'s';p.style.opacity=(.25+Math.random()*.6).toFixed(2);field.appendChild(p)}
  }
  function tone(freq,duration){
    if(!soundOn)return;
    try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();var osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),now=audioCtx.currentTime;osc.type='sine';osc.frequency.setValueAtTime(freq,now);osc.frequency.exponentialRampToValueAtTime(Math.max(90,freq*.72),now+duration);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.045,now+.012);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+duration+.02)}catch(e){}
  }
  soundButton.addEventListener('click',function(){soundOn=!soundOn;soundButton.textContent='♫ SOUND: '+(soundOn?'ON':'OFF');soundButton.setAttribute('aria-pressed',String(soundOn));if(soundOn){tone(660,.12);showToast('AUDIO SYSTEM ONLINE')}else showToast('AUDIO MUTED')});
  fxButton.addEventListener('click',function(){fxOn=!fxOn;fxButton.textContent='✦ FX: '+(fxOn?'ON':'OFF');fxButton.setAttribute('aria-pressed',String(fxOn));makeParticles();showToast(fxOn?'VISUAL FX ONLINE':'VISUAL FX OFF')});
  document.addEventListener('click',function(e){if(e.target.closest('.card'))tone(520,.1);else if(e.target.closest('.btn,.ib,.big,.opt,.tile,.dp button,#cb'))tone(420,.07)});
  var cards=document.getElementById('cards');
  cards.addEventListener('pointermove',function(e){if(e.pointerType==='touch')return;var card=e.target.closest('.card');if(!card)return;var r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;card.style.transform='perspective(700px) rotateX('+((.5-y)*7)+'deg) rotateY('+((x-.5)*9)+'deg) translateY(-3px)'});
  cards.addEventListener('pointerout',function(e){var card=e.target.closest('.card');if(card&&!card.contains(e.relatedTarget))card.style.transform=''});
  // Wrap launch/restart handlers with a short transition while preserving game logic.
  var originalOpen=open;
  open=function(i){originalOpen(i);var stage=document.getElementById('st');stage.classList.remove('transitioning');void stage.offsetWidth;stage.classList.add('transitioning');tone(740,.16)};
  var originalShut=shut;
  shut=function(){originalShut();tone(330,.1)};
  makeParticles();window.addEventListener('resize',function(){if(fxOn)makeParticles()},{passive:true});
})();

</script>
